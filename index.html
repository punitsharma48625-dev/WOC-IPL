<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Stats — Points Table</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">League <span class="brand-accent">Stats</span></div>
    <nav class="mainnav">
      <a href="index.html" class="active">Points Table</a>
      <a href="batting.html">Batting</a>
      <a href="bowling.html">Bowling</a>
      <a href="records.html">Records</a>
      <a href="player.html">Player Search</a>
      <a href="positions.html">Player Position</a>
      <a href="matchup.html">Matchup</a>
    </nav>
  </div>
</div>

<main>
  <h1>Points Table</h1>
  <p class="page-lede">Standings across the season, ranked by points then net run rate.</p>

  <div class="card">
    <div id="filter-bar"></div>
    <div id="points-table"><p class="loading-note">Loading standings…</p></div>
  </div>
</main>

<footer>Data refreshes automatically from the CSV files in /data — no manual rebuild needed.</footer>

<script src="app.js?v=2"></script>
<script>
(async function () {
  const container = document.getElementById('points-table');
  const filterBarEl = document.getElementById('filter-bar');
  try {
    const rows = await loadCSV(DATA.points);

    const cols = [
      { key: 'team', label: 'Team' },
      { key: 'matches', label: 'M', num: true },
      { key: 'wins', label: 'W', num: true },
      { key: 'losses', label: 'L', num: true },
      { key: 'points', label: 'Pts', num: true },
      {
        key: 'nrr', label: 'NRR', num: true,
        format: (v) => (v > 0 ? '+' : '') + Number(v).toFixed(2),
        cellClass: (row) => (row.nrr >= 0 ? 'pos-nrr' : 'neg-nrr'),
      },
    ];

    function render(filters) {
      let filtered = rows.slice();
      if (filters.search) {
        filtered = filtered.filter(r => nameMatches(r.team, filters.search));
      }
      const n = filters.numeric || {};
      if (n.wins != null) filtered = filtered.filter(r => r.wins >= n.wins);
      if (n.points != null) filtered = filtered.filter(r => r.points >= n.points);

      // default sort: points desc, then nrr desc as tiebreak
      filtered.sort((a, b) => (b.points - a.points) || (b.nrr - a.nrr));

      renderSortableTable(container, cols, filtered, 'points', 'desc');
    }

    buildFilterBar(filterBarEl, {
      withFormat: false, withVenue: false, withOpponent: false,
      withSearch: true, withMinMatches: false,
      searchLabel: 'Search team',
      searchPlaceholder: 'e.g. MI, CSK…',
      numericFilters: [
        { key: 'wins', label: 'Min wins', placeholder: 'e.g. 10' },
        { key: 'points', label: 'Min points', placeholder: 'e.g. 20' },
      ],
    }, render);

    render({ search: '', numeric: {} });
  } catch (e) {
    container.innerHTML = '<p class="empty-state">Could not load the points table. Check that data/points_league_nrr.csv exists.</p>';
    console.error(e);
  }
})();
</script>

</body>
</html>
